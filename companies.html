    <!-- ========== Header ========== -->
    <!-- ========== Header ========== -->
    <header class="header" id="app-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            <h1 class="header-title" id="page-title">Companies</h1>
        </div>
        <div class="header-right" id="header-actions">
            <span class="text-xs text-muted" id="header-date"></span>
            <a href="/applications" class="btn btn-outline btn-sm">View Applications</a>
        </div>
    </header>

    <main id="main" class="app-main">
        <h2 class="visually-hidden">Company list</h2>
        <section class="page-header mb-6">
            <p class="page-subtitle">Your applications grouped by company, derived directly from your application records.</p>
        </section>

        <div class="flex flex-col sm:flex-row gap-3 items-end mb-6">
            <div class="flex-1 min-w-0" style="max-width: 380px;">
                <div class="search-field">
                    <label class="visually-hidden" for="company-search">Search companies</label>
                    <input type="search" id="company-search" placeholder="Search companies…" autocomplete="off">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"/></svg>
                </div>
            </div>
        </div>

        <div class="grid gap-4 mb-6" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));" id="company-stats">
            <!-- Stats injected by JS -->
        </div>

        <div id="companies-container">
            <!-- Companies injected by JS -->
        </div>
    </main>

    <!-- ========== Company Detail Modal ========== -->
    <div class="modal-overlay" id="company-modal">
        <div class="modal" style="max-width: 680px;">
            <div class="modal-header">
                <h3 class="modal-title" id="company-modal-title">Company</h3>
                <button class="close-modal" id="close-company-modal" aria-label="Close dialog">&times;</button>
            </div>
            <div class="modal-body" id="company-modal-content"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="company-close-btn">Close</button>
            </div>
        </div>
    </div>


    <script type="module" src="js/dropdown.js"></script>
    <script type="module" src="js/app-shell.js"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { formatDate, escapeHtml, initials, parseDate, showToast, statusBadgeClass, icon } from './js/utils.js';
        import { mountShell } from './js/app-shell.js';

        // ---- State ----
        let apps = [];
        let companyGroups = [];
        let searchTerm = '';

        // ---- DOM refs ----
        const container = document.getElementById('companies-container');
        const statsEl = document.getElementById('company-stats');
        const searchInput = document.getElementById('company-search');
        const companyModal = document.getElementById('company-modal');
        const companyModalContent = document.getElementById('company-modal-content');

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', () => {
            mountShell({ active: 'companies', title: 'Companies' });
            loadCompanies();
            setupSearch();
            setupCompanyModal();
        });

        async function loadCompanies() {
            container.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">Loading companies&hellip;</div></div>`;
            try {
                const res = await api.getAllApplications();
                apps = res.data || [];
                groupByCompany();
                render();
            } catch (err) {
                console.error('Failed to load companies:', err);
                container.innerHTML = emptyState('Unable to load companies. Please check your connection.', 'error');
                showToast('Failed to load company data.', 'error');
            }
        }

        // Group applications by company (derived, no separate collection needed)
        function groupByCompany() {
            const map = new Map();
            apps.forEach(app => {
                const key = app.companyName;
                if (!map.has(key)) {
                    map.set(key, {
                        name: key,
                        website: app.companyWebsite || null,
                        applications: [],
                        recruiterName: null,
                        recruiterEmail: null,
                        recruiterLinkedIn: null,
                        latestDate: null,
                        notes: []
                    });
                }
                const g = map.get(key);
                g.applications.push(app);

                // Keep the first non-empty contact info
                if (!g.recruiterName && app.recruiterName) g.recruiterName = app.recruiterName;
                if (!g.recruiterEmail && app.recruiterEmail) g.recruiterEmail = app.recruiterEmail;
                if (!g.recruiterLinkedIn && app.recruiterLinkedIn) g.recruiterLinkedIn = app.recruiterLinkedIn;
                if (!g.website && app.companyWebsite) g.website = app.companyWebsite;

                // Track latest activity date
                const d = parseDate(app.applicationDate || app.createdAt);
                if (!isNaN(d) && (!g.latestDate || d > g.latestDate)) g.latestDate = d;

                // Collect unique notes
                if (app.notes && !g.notes.includes(app.notes)) g.notes.push(app.notes);
            });

            companyGroups = Array.from(map.values()).sort((a, b) => b.applications.length - a.applications.length);
        }

        function render() {
            renderStats();

            const filtered = searchTerm
                ? companyGroups.filter(g => g.name.toLowerCase().includes(searchTerm))
                : companyGroups;

            if (!filtered.length) {
                container.innerHTML = searchTerm
                    ? emptyState(`No companies match "${searchTerm}".`, 'empty')
                    : emptyState('No companies yet. Add applications to see them grouped here.', 'empty');
                return;
            }

            container.innerHTML = `
                <div class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));">
                    ${filtered.map(g => companyCard(g)).join('')}
                </div>
            `;

            // Attach click handlers
            container.querySelectorAll('[data-company]').forEach(el => {
                el.addEventListener('click', () => openCompany(el.dataset.company));
            });
        }

        function renderStats() {
            const totalCompanies = companyGroups.length;
            const totalApps = apps.length;
            const multi = companyGroups.filter(g => g.applications.length > 1).length;
            const withRecruiter = companyGroups.filter(g => g.recruiterName || g.recruiterEmail).length;

            statsEl.innerHTML = `
                ${stat('Total Companies', totalCompanies, 'Distinct company names', icon('companies'), 'text-primary', 'bg-primary-light')}
                ${stat('Total Applications', totalApps, 'Across all companies', icon('file'), 'text-info', 'bg-info-light')}
                ${stat('Multiple Roles', multi, 'Companies with 2+ applications', icon('refresh'), 'text-warning', 'bg-warning-light')}
                ${stat('With Recruiter Contact', withRecruiter, 'Companies with contact info', icon('user'), 'text-success', 'bg-success-light')}
            `;
        }

        function stat(label, value, sub, icon, colorClass, bgClass) {
            return `
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div class="stat-card-content">
                            <p class="stat-card-label">${escapeHtml(label)}</p>
                            <p class="stat-card-value ${colorClass}">${value}</p>
                            <p class="stat-card-sub">${escapeHtml(sub)}</p>
                        </div>
                        <div class="stat-card-icon ${bgClass}">${icon}</div>
                    </div>
                </div>
            `;
        }

        function companyCard(g) {
            const active = g.applications.filter(a => ['Applied','Assessment','Interview','Offer'].includes(a.status)).length;
            const statuses = {};
            g.applications.forEach(a => { statuses[a.status] = (statuses[a.status] || 0) + 1; });

            return `
                <div class="card" data-company="${escapeHtml(g.name)}" role="button" tabindex="0"
                     style="cursor:pointer;">
                    <div class="card-body p-5">
                        <div class="flex items-start gap-3 mb-4">
                            <div class="w-11 h-11 rounded-lg bg-primary-light flex items-center justify-center text-primary font-bold" style="flex-shrink:0;">${initials(g.name)}</div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-semibold text-base text-main truncate">${escapeHtml(g.name)}</h3>
                                <p class="text-xs text-muted">${g.applications.length} application${g.applications.length === 1 ? '' : 's'} &bull; ${active} active</p>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-1 mb-3">
                            ${Object.entries(statuses).map(([s, n]) => `<span class="badge ${statusBadgeClass(s)} text-xs">${escapeHtml(s)}: ${n}</span>`).join('')}
                        </div>

                        <div class="text-xs text-muted space-y-1">
                            ${g.website ? `<div class="icon-inline">${icon('globe')} ${escapeHtml(g.website)}</div>` : ''}
                            ${g.recruiterName ? `<div class="icon-inline">${icon('user')} ${escapeHtml(g.recruiterName)}${g.recruiterEmail ? ' &bull; ' + escapeHtml(g.recruiterEmail) : ''}</div>` : ''}
                            <div class="icon-inline">${icon('calendar')} Latest: ${formatDate(g.latestDate)}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ---- Company detail modal ----
        function openCompany(name) {
            const g = companyGroups.find(x => x.name === name);
            if (!g) return;

            document.getElementById('company-modal-title').textContent = g.name;

            companyModalContent.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-14 h-14 rounded-lg bg-primary-light flex items-center justify-center text-primary font-bold text-lg">${initials(g.name)}</div>
                    <div>
                        <p class="text-sm text-secondary">${g.applications.length} application${g.applications.length === 1 ? '' : 's'} &bull; latest ${formatDate(g.latestDate)}</p>
                        ${g.website ? `<a href="${escapeHtml(g.website)}" target="_blank" rel="noopener noreferrer" class="text-sm text-primary hover:underline">${escapeHtml(g.website)}</a>` : ''}
                    </div>
                </div>

                ${g.recruiterName || g.recruiterEmail || g.recruiterLinkedIn ? `
                <div class="mb-4 p-3 rounded-lg bg-slate-50 border border-border">
                    <span class="text-xs font-semibold text-secondary block mb-1">Recruiter Contact</span>
                    ${g.recruiterName ? `<div class="text-sm">${escapeHtml(g.recruiterName)}</div>` : ''}
                    ${g.recruiterEmail ? `<div class="text-sm text-secondary">${escapeHtml(g.recruiterEmail)}</div>` : ''}
                    ${g.recruiterLinkedIn ? `<a href="${escapeHtml(g.recruiterLinkedIn)}" target="_blank" rel="noopener noreferrer" class="text-sm text-primary hover:underline">LinkedIn profile</a>` : ''}
                </div>` : ''}

                <div class="mb-4">
                    <span class="text-xs font-semibold text-secondary block mb-2">Applications</span>
                    <div class="space-y-2">
                        ${g.applications.map(a => `
                            <div class="flex items-center gap-3 p-3 rounded-md border border-border">
                                <div class="w-8 h-8 rounded-lg bg-primary-light flex items-center justify-center text-primary font-semibold text-xs">${initials(a.companyName)}</div>
                                <div class="flex-1 min-w-0">
                                    <div class="text-sm font-medium text-main truncate">${escapeHtml(a.jobRole)}</div>
                                    <div class="text-xs text-muted">${formatDate(a.applicationDate)}</div>
                                </div>
                                <span class="badge ${statusBadgeClass(a.status)} text-xs">${escapeHtml(a.status)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${g.notes.length ? `
                <div>
                    <span class="text-xs font-semibold text-secondary block mb-1">Notes</span>
                    ${g.notes.map(n => `<p class="text-sm text-secondary whitespace-pre-wrap mb-2">${escapeHtml(n)}</p>`).join('')}
                </div>` : ''}
            `;

            companyModal.classList.add('open');
        }

        function setupCompanyModal() {
            const closeBtn = document.getElementById('close-company-modal');
            const closeBtn2 = document.getElementById('company-close-btn');
            const close = () => companyModal.classList.remove('open');
            closeBtn.addEventListener('click', close);
            closeBtn2.addEventListener('click', close);
            companyModal.addEventListener('click', (e) => { if (e.target === companyModal) close(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
        }

        // ---- Search ----
        function setupSearch() {
            let timer;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    searchTerm = e.target.value.trim().toLowerCase();
                    render();
                }, 250);
            });
        }

        function emptyState(msg, type = 'empty') {
            const glyph = type === 'error' ? icon('alert') : icon('companies');
            return `
                <div class="empty-state" style="padding: var(--space-16) var(--space-8);">
                    <div class="empty-state-icon" style="width:48px;height:48px;">${glyph}</div>
                    <div class="empty-state-title">${escapeHtml(msg)}</div>
                    ${type === 'empty' ? `<p class="empty-state-desc">Companies are derived from your application records, so adding applications will populate this page automatically.</p>` : ''}
                </div>
            `;
        }
    </script>

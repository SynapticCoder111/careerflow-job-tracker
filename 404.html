<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — CareerFlow</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/design-system.css" rel="stylesheet">
    <link href="css/landing.css" rel="stylesheet">
</head>
<body style="min-height:100vh;display:grid;place-items:center;background:var(--navy-900);color:#fff;">
    <div style="text-align:center;padding:var(--space-8);max-width:520px;">
        <p style="font-size:var(--text-7,5rem);font-weight:var(--weight-extrabold);letter-spacing:-.04em;line-height:1;background:linear-gradient(180deg,#fff,#8fa3c8);-webkit-background-clip:text;background-clip:text;color:transparent;">404</p>
        <h1 style="font-size:var(--text-3xl);font-weight:var(--weight-bold);letter-spacing:-.03em;margin:var(--space-4) 0 var(--space-3);">This page took a wrong turn</h1>
        <p style="font-size:var(--text-lg);color:rgb(255 255 255,.6);line-height:var(--leading-relaxed);margin-bottom:var(--space-8);">
            The page you're looking for doesn't exist or has moved. Let's get you back somewhere useful.
        </p>
        <div style="display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap;">
            <a href="/" class="btn btn-primary btn-lg">Back to home</a>
            <a href="/dashboard" class="btn btn-inverse btn-lg">Open dashboard</a>
        </div>
    </div>
</body>
</html>

    <!-- ========== Header ========== -->
    <!-- ========== Header ========== -->
    <header class="header" id="app-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            <h1 class="header-title" id="page-title">Pipeline</h1>
        </div>
        <div class="header-right" id="header-actions">
            <span class="text-xs text-muted" id="header-date"></span>
            <button class="btn btn-primary btn-sm" id="add-from-pipeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add Application</button>
        </div>
    </header>

    <main id="main" class="app-main">
        <section class="page-header mb-6">
            <h2 class="page-title">Kanban Pipeline</h2>
            <p class="page-subtitle">Visualize your job search pipeline. Click a card to view details, use the dropdown to change status.</p>
        </section>

        <div class="kanban-board" id="kanban-board">
            <!-- Kanban columns injected by JS -->
        </div>
    </main>

    <!-- ========== Application Detail Modal ========== -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal" style="max-width: 640px;">
            <div class="modal-header">
                <h3 class="modal-title" id="detail-title">Application Details</h3>
                <button class="close-modal" id="close-detail-modal" aria-label="Close dialog">&times;</button>
            </div>
            <div class="modal-body" id="detail-content">
                <!-- Detail content injected by JS -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="detail-edit-btn">Edit</button>
                <button class="btn btn-danger" id="detail-delete-btn">Delete</button>
                <button class="btn btn-outline" id="detail-close-btn">Close</button>
            </div>
        </div>
    </div>


    <script type="module" src="js/dropdown.js"></script>
    <script type="module" src="js/app-shell.js"></script>
    <script type="module">
        import { api } from './js/api.js';
        import { formatDate, formatDateInput, isOverdue, isWithinDays, initials, escapeHtml, showToast, STATUSES, statusBadgeClass, icon } from './js/utils.js';
        import { mountShell } from './js/app-shell.js';
        import { Dropdown } from './js/dropdown.js';
        import { confirmDialog } from './js/dialog.js';

        // ---- State ----
        let apps = [];
        const STATUS_ORDER = ["Bookmarked", "Applied", "Assessment", "Interview", "Offer", "Rejected", "Withdrawn"];

        // ---- DOM refs ----
        const kanbanBoard = document.getElementById('kanban-board');
        const detailModal = document.getElementById('detail-modal');
        const detailContent = document.getElementById('detail-content');

        // ---- Init ----
        document.addEventListener('DOMContentLoaded', () => {
            mountShell({ active: 'pipeline', title: 'Pipeline' });
            loadPipeline();
            setupDetailModal();
        });

        async function loadPipeline() {
            showLoading();
            try {
                const res = await api.getAllApplications({ sort: 'createdAt:asc' });
                apps = res.data || [];
                renderPipeline();
            } catch (err) {
                console.error('Failed to load pipeline:', err);
                kanbanBoard.innerHTML = emptyState('Unable to load applications. Please check your connection.', 'error');
                showToast('Failed to load pipeline data.', 'error');
            }
        }

        function showLoading() {
            kanbanBoard.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">Loading pipeline&hellip;</div></div>`;
        }

        function renderPipeline() {
            if (!apps.length) {
                kanbanBoard.innerHTML = emptyState('No applications yet. Add your first application to see the pipeline.', 'empty');
                return;
            }

            const columns = STATUS_ORDER.map(status => {
                const columnApps = apps.filter(a => a.status === status);
                return {
                    status,
                    count: columnApps.length,
                    apps: columnApps
                };
            });

            kanbanBoard.innerHTML = columns.map(col => `
                <div class="kanban-column" data-status="${escapeHtml(col.status)}">
                    <div class="kanban-column-header">
                        <div class="kanban-column-title">
                            <span class="badge ${statusBadgeClass(col.status)} text-xs">${escapeHtml(col.status)}</span>
                            <span class="kanban-column-count">${col.count}</span>
                        </div>
                    </div>
                    <div class="kanban-column-dropzone" id="dropzone-${escapeHtml(col.status)}">
                        ${col.apps.length ? col.apps.map(app => kanbanCard(app)).join('') : '<div class="kanban-empty">No applications</div>'}
                    </div>
                </div>
            `).join('');

            // Attach event listeners
            attachCardListeners();
        }

        function kanbanCard(app) {
            const salaryDisplay = app.salaryMin || app.salaryMax
                ? [app.salaryMin, app.salaryMax].filter(Boolean).join(' - ')
                : null;

            return `
                <div class="kanban-card" data-app-id="${escapeHtml(app.id)}">
                    <div class="kanban-card-header">
                        <div class="kanban-card-company">
                            <div class="kanban-card-avatar">${initials(app.companyName)}</div>
                            <h3 class="kanban-card-title">${escapeHtml(app.companyName)}</h3>
                        </div>
                    </div>
                    <p class="kanban-card-role">${escapeHtml(app.jobRole)}</p>
                    <div class="kanban-card-meta">
                        <span class="kanban-card-meta-item">${formatDate(app.applicationDate)}</span>
                        ${app.workMode ? `<span class="kanban-card-meta-item">${escapeHtml(app.workMode)}</span>` : ''}
                        ${app.priority ? `<span class="kanban-card-meta-item kanban-card-priority ${escapeHtml(app.priority)}">${escapeHtml(app.priority)}</span>` : ''}
                    </div>
                    ${app.followUpDate ? `<div class="text-xs text-warning mt-2 icon-inline">${icon('phone')} Follow-up: ${formatDate(app.followUpDate)}</div>` : ''}
                    ${app.interviewDate ? `<div class="text-xs text-info mt-1 icon-inline">${icon('calendar')} Interview: ${formatDate(app.interviewDate)}</div>` : ''}
                    ${app.deadline ? `<div class="text-xs text-error mt-1 icon-inline">${icon('clock')} Deadline: ${formatDate(app.deadline)}</div>` : ''}
                    <div class="flex gap-2 mt-3 pt-2 border-t border-border" style="align-items:center;">
                        <button class="btn-icon btn-sm text-primary" data-action="view" data-id="${escapeHtml(app.id)}" aria-label="View details for ${escapeHtml(app.companyName)}" style="flex:0 0 auto;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1.1rem;height:1.1rem;"><path d="M15 2l6 6"></path><path d="M9 21v-6a4 4 0 0 1 4-4h5"></path></svg>
                        </button>
                        <div class="status-dropdown" data-status-for="${escapeHtml(app.id)}" data-status="${escapeHtml(app.status)}" style="flex:1 1 auto; min-width:0;"></div>
                    </div>
                </div>
            `;
        }

        function attachCardListeners() {
            document.querySelectorAll('.kanban-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    // The card is a click target for mouse users; its controls are
                    // real buttons and must not double-trigger it.
                    const viewBtn = e.target.closest('button[data-action="view"]');
                    if (viewBtn) {
                        viewApp(viewBtn.dataset.id);
                        return;
                    }
                    if (e.target.closest('.dropdown, button')) return;
                    const id = card.dataset.appId;
                    if (id) viewApp(id);
                });
            });

            // Replace each status placeholder with a real dropdown component.
            document.querySelectorAll('.status-dropdown').forEach(host => {
                const id = host.dataset.statusFor;
                const current = host.dataset.status;
                const trigger = document.createElement('button');
                trigger.type = 'button';
                trigger.className = 'dropdown-trigger dropdown-trigger-sm';
                trigger.style.width = '100%';
                trigger.style.justifyContent = 'space-between';

                const label = document.createElement('span');
                label.className = 'dropdown-value';
                label.textContent = current;
                trigger.appendChild(label);

                const caret = document.createElement('span');
                caret.innerHTML = `<svg class="dropdown-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
                trigger.appendChild(caret);

                const dd = new Dropdown({
                    trigger,
                    items: STATUSES.map((s) => ({ value: s, label: s })),
                    value: current,
                    ariaLabel: `Status for ${id}`,
                    align: 'end',
                    portal: true,
                });

                dd.onChange = async (newStatus) => {
                    if (!newStatus || newStatus === current) return;
                    try {
                        await api.updateApplication(id, { status: newStatus });
                        showToast(`Status updated to ${newStatus}`);
                        loadPipeline(); // move the card to its new column
                    } catch (err) {
                        console.error('Status update failed:', err);
                        showToast(err.message || 'Failed to update status', 'error');
                    }
                };

                host.appendChild(dd.wrapper);
            });
        }

        // ---- Detail Modal ----
        function viewApp(id) {
            const app = apps.find(a => a.id === id);
            if (!app) { showToast('Application not found.', 'error'); return; }

            const salaryDisplay = app.salaryMin || app.salaryMax
                ? [app.salaryMin, app.salaryMax].filter(Boolean).join(' - ')
                : null;

            detailContent.innerHTML = `
                <div class="mb-4">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-12 h-12 rounded-lg bg-primary-light flex items-center justify-center text-primary font-bold">${initials(app.companyName)}</div>
                        <div>
                            <h4 class="text-lg font-semibold text-main">${escapeHtml(app.companyName)}</h4>
                            <p class="text-sm text-secondary">${escapeHtml(app.jobRole)}</p>
                        </div>
                        <span class="badge ${statusBadgeClass(app.status)} ml-auto">${escapeHtml(app.status)}</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><span class="text-xs text-muted block">Application Date</span><span class="text-sm font-medium">${formatDate(app.applicationDate)}</span></div>
                    <div><span class="text-xs text-muted block">Priority</span><span class="text-sm font-medium">${escapeHtml(app.priority || '—')}</span></div>
                    <div><span class="text-xs text-muted block">Work Mode</span><span class="text-sm font-medium">${escapeHtml(app.workMode || '—')}</span></div>
                    <div><span class="text-xs text-muted block">Employment Type</span><span class="text-sm font-medium">${escapeHtml(app.employmentType || '—')}</span></div>
                    <div><span class="text-xs text-muted block">Location</span><span class="text-sm font-medium">${escapeHtml(app.location || '—')}</span></div>
                    <div><span class="text-xs text-muted block">Job Source</span><span class="text-sm font-medium">${escapeHtml(app.jobSource || '—')}</span></div>
                    <div><span class="text-xs text-muted block">Follow-up Date</span><span class="text-sm font-medium ${app.followUpDate && isOverdue(app.followUpDate) ? 'text-error' : ''}">${formatDate(app.followUpDate)}</span></div>
                    <div><span class="text-xs text-muted block">Interview Date</span><span class="text-sm font-medium">${formatDate(app.interviewDate)}</span></div>
                    <div><span class="text-xs text-muted block">Deadline</span><span class="text-sm font-medium">${formatDate(app.deadline)}</span></div>
                    <div><span class="text-xs text-muted block">Salary Range</span><span class="text-sm font-medium">${salaryDisplay || '—'}</span></div>
                </div>
                ${app.recruiterName || app.recruiterEmail ? `
                <div class="mb-4 p-3 rounded-lg bg-slate-50 border border-border">
                    <span class="text-xs font-semibold text-secondary block mb-1">Recruiter</span>
                    ${app.recruiterName ? `<div class="text-sm">${escapeHtml(app.recruiterName)}</div>` : ''}
                    ${app.recruiterEmail ? `<div class="text-sm text-secondary">${escapeHtml(app.recruiterEmail)}</div>` : ''}
                </div>` : ''}
                ${app.tags && app.tags.length ? `
                <div class="mb-4">
                    <span class="text-xs font-semibold text-secondary block mb-2">Tags</span>
                    <div class="flex flex-wrap gap-1">${app.tags.map(t => `<span class="badge badge-secondary text-xs">${escapeHtml(t)}</span>`).join('')}</div>
                </div>` : ''}
                ${app.jobLink ? `
                <div class="mb-4">
                    <a href="${escapeHtml(app.jobLink)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm">View Job Posting &rarr;</a>
                </div>` : ''}
                ${app.notes ? `
                <div>
                    <span class="text-xs font-semibold text-secondary block mb-1">Notes</span>
                    <p class="text-sm text-secondary whitespace-pre-wrap">${escapeHtml(app.notes)}</p>
                </div>` : ''}
            `;

            detailModal.dataset.appId = id;
            detailModal.classList.add('open');
        }

        function setupDetailModal() {
            const closeBtn = document.getElementById('close-detail-modal');
            const closeBtn2 = document.getElementById('detail-close-btn');
            const editBtn = document.getElementById('detail-edit-btn');
            const deleteBtn = document.getElementById('detail-delete-btn');

            const closeModal = () => detailModal.classList.remove('open');
            closeBtn.addEventListener('click', closeModal);
            closeBtn2.addEventListener('click', closeModal);
            detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

            editBtn.addEventListener('click', () => {
                const id = detailModal.dataset.appId;
                if (id) { closeModal(); window.location.href = '/applications#edit-' + id; }
            });
            deleteBtn.addEventListener('click', () => {
                const id = detailModal.dataset.appId;
                if (id) { closeModal(); confirmDelete(id); }
            });
        }

        // ---- Delete Confirmation ----
        async function confirmDelete(id) {
            const app = apps.find(a => a.id === id);
            if (!app) return;

            const confirmed = await confirmDialog({
                title: 'Delete application?',
                message: `Delete the application at ${app.companyName}? Interview rounds linked to it are removed too. This cannot be undone.`,
                confirmLabel: 'Delete application',
                tone: 'danger'
            });
            if (confirmed) deleteApp(id);
        }

        async function deleteApp(id) {
            try {
                await api.deleteApplication(id);
                showToast('Application deleted successfully.');
                loadPipeline();
            } catch (err) {
                console.error('Delete failed:', err);
                showToast(err.message || 'Failed to delete application.', 'error');
            }
        }

        function emptyState(msg, type = 'empty') {
            const glyph = type === 'error' ? icon('alert') : icon('inbox');
            return `
                <div class="empty-state" style="padding: var(--space-12) var(--space-8); grid-column: 1 / -1;">
                    <div class="empty-state-icon" style="width:48px;height:48px;">${glyph}</div>
                    <div class="empty-state-title">${escapeHtml(msg)}</div>
                    ${type === 'empty' ? `<p class="empty-state-desc">Add your first application to get started tracking your job search.</p>` : ''}
                </div>
            `;
        }
    </script>
</body>
